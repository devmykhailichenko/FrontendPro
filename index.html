<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Frontend Pro</title>
    <link rel="stylesheet" href="./styles.css">
</head>
<body>

<label>
    I agree
    <input id="agreeCheckbox" type="checkbox">
</label>

<select id="citySelect">
    <option value="">Select a city</option>
    <option value="kyiv">Kyiv</option>
    <option value="kharkiv">Kharkiv</option>
    <option value="odessa">Odessa</option>
</select>

<div id="radioContainer">
    <label>
        Red
        <input type="radio" name="color" value="red">
    </label>
    <label>
        Blue
        <input type="radio" name="color" value="blue">
    </label>
</div>

<form id="loginForm">
    <div class="row">
        <label>
            Email:
            <input id="emailInput" type="email" name="email" required>
        </label>
    </div>

    <div class="row">
        <label>
            Password:
            <input id="passInput" type="password" name="password" required minlength="6" maxlength="20">
        </label>
    </div>

    <div class="row">
        <button type="submit" id="submitButton">Login</button>
        <button type="button" id="clearButton">Clear</button>
    </div>
</form>

<form id="formWithData" novalidate>
    <div class="row">
        <label>
            User Name:
            <input name="username" type="text" placeholder="Username">
        </label>
        <span id="error-username"></span>
    </div>

    <div class="row">
        <label>
            Email:
            <input type="text" name="email" placeholder="Email" required minlength="6">
        </label>
        <span id="error-email"></span>
    </div>

    <div class="row">
        <label>
            HTML
            <input name="skills" type="checkbox" value="html">
        </label>
        <label>
            JavaScript
            <input name="skills" type="checkbox" value="js">
        </label>
    </div>

    <button type="submit">Send</button>
</form>

<div id="result"></div>

<script src="./script.js"></script>
</body>
</html>
